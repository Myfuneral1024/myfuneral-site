<html lang="ko">
<head>

<style>
:root{
  --bg:#f5f5f3; --surface:#ffffff; --sunk:#ededeb; --ink:#1e1e1d; --ink2:#3b3b39; --muted:#5e5e5b;
  --line:#dddddb; --edge:#9b9b97; --pine:#252525; --pine-ink:#ffffff; --pine-soft:#ebebe8;
  --warn:#963a1c; --warn-soft:#f5e4dc; --ok:#2d5a3c; --ok-soft:#e3ede6;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --top:56px; --nav:64px; --ease:cubic-bezier(0.23,1,0.32,1);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121212; --surface:#1b1b1a; --sunk:#161615; --ink:#ebebe8; --ink2:#c9c9c5; --muted:#a2a29d;
  --line:#2f2f2d; --edge:#62625e; --pine:#ebebe8; --pine-ink:#151515; --pine-soft:#2b2b29;
  --warn:#eba387; --warn-soft:#3a2219; --ok:#9fd0ae; --ok-soft:#1d2b21; color-scheme:dark }}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--top) + 12px);scroll-padding-bottom:calc(var(--nav) + 96px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;line-height:1.3}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
[hidden]{display:none!important}
.nw{white-space:nowrap}
.kv a,.cpres a{color:inherit;text-underline-offset:3px}
.kv dd a{display:inline-flex;align-items:center;min-height:44px;margin:-11px 0}
.h2 a{display:inline-flex;align-items:center;min-height:44px;margin:-12px 0}
.dl{display:flex;justify-content:space-between;gap:10px}
.dl b{white-space:nowrap;font-weight:500}
.muted{color:var(--muted)}
.small{font-size:14px}

/* 위 막대 · 아래 메뉴 */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:760px;margin:0 auto;height:var(--top);display:flex;align-items:center;gap:6px;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.top h1{flex:1;min-width:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;min-height:44px;flex:1;min-width:0}
.brand svg{display:block;flex:none}
.brand small{font-size:13px;color:var(--muted);white-space:nowrap}
.ib{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border:0;background:none;border-radius:4px;color:var(--ink2);cursor:pointer;padding:0 6px;flex:none}
.ib:hover{background:var(--sunk)}
.me-btn{width:36px;height:36px;border-radius:50%;background:var(--pine);color:var(--pine-ink);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:500;position:relative}
.nav a svg{display:block}
.nav a[aria-current="page"]{color:var(--ink);font-weight:700}
.nav a[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--pine)}
.nav .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
main{max-width:760px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right,0px)) calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
body.nonav main{padding-bottom:40px}
body.hasbar main{padding-bottom:calc(var(--nav) + 104px + env(safe-area-inset-bottom,0px))}

/* 부품 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;font-family:var(--serif)}
.sec-h .no{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;padding:0 6px;background:var(--pine);color:var(--pine-ink);font-family:var(--sans);font-size:13px;font-weight:700;border-radius:2px}
.sec-h small{margin-left:auto;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:4px;border:1px solid transparent;font-weight:700;text-decoration:none;cursor:pointer;background:none;font-size:16px;color:var(--ink)}
.btn-p{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.btn-l{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.btn-g{color:var(--ink2);padding:0 8px;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.btn-w{background:var(--surface);color:var(--warn);border-color:var(--warn)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-lg{min-height:56px;font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:420px){.grid2.st{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:14px;font-weight:700;color:var(--ink2)}
.lbl span{font-weight:400;color:var(--muted)}
.in{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--edge);border-radius:4px;background:var(--surface);font-size:16px}
textarea.in{padding:10px 12px;line-height:1.65;resize:vertical;min-height:84px}
select.in{padding-right:8px}
.in.big{min-height:56px;font-size:18px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:46px;padding:0 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;font-size:15px;line-height:1.25}
.seg button[aria-pressed="true"]{border:2px solid var(--pine);background:var(--pine-soft);font-weight:700}
.seg.wrap{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.chk{display:flex;align-items:flex-start;gap:10px;min-height:44px;cursor:pointer;padding:10px 0}
.chk input{width:22px;height:22px;accent-color:var(--pine);margin:1px 0 0;flex:none}
.note{font-size:14px;color:var(--muted)}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:10px 12px;font-size:14px}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:4px;padding:10px 12px;font-size:14px;font-weight:500}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:12px;font-size:12.5px;font-weight:700;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.chip.dark{background:var(--pine);color:var(--pine-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:13px 14px;border-top:1px solid var(--line);text-decoration:none;color:inherit;align-items:center;min-height:64px}
.li:first-child{border-top:0}
.li:hover{background:var(--sunk)}
.li b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{grid-column:1;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;color:var(--muted)}
.h2{font-size:15px;font-weight:700;color:var(--ink2);margin:18px 2px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.h2 a{font-weight:500;font-size:14px;color:var(--ink2)}
.kv{margin:0;display:flex;flex-direction:column}
.kv>div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.kv>div:first-child{border-top:0}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0;font-weight:500;min-width:0}
.kv dd small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{text-align:left;padding:9px 4px;border-top:1px solid var(--line);vertical-align:top}
.tbl thead th{border-top:0;border-bottom:1px solid var(--ink);font-size:13px;color:var(--muted);font-weight:500}
.tbl td.v{text-align:right;white-space:nowrap}
.tbl td small{display:block;color:var(--muted);font-size:13px}
.tbl tr.minus td{color:var(--ink2)}
.tbl tfoot td{border-top:2px solid var(--ink);font-weight:700;font-size:17px}
.tbl.fx{table-layout:fixed}.tbl col.g{width:5.8em}.tbl col.v{width:7.6em}
@media (max-width:360px){.tbl{font-size:14px}.tbl th,.tbl td{padding:9px 3px}.tbl col.v{width:6.8em}.tbl tfoot td{font-size:15px}}
.big-total{font-family:var(--serif);font-weight:900;font-size:26px}
.search{position:relative}
.search .in{padding-left:44px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;padding:10px 6px;background:var(--surface);border:1px solid var(--line);border-radius:4px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px;text-align:center;line-height:1.3}
.quick a svg{color:var(--ink2)}
.hello{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px;background:var(--pine);color:var(--pine-ink);border-radius:4px}
.hello b{font-family:var(--serif);font-size:20px}
.hello span{font-size:14px;opacity:.85}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:2px solid var(--warn);border-radius:4px;color:var(--warn);font-weight:700;text-decoration:none;min-height:52px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{flex:none;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink2);text-decoration:none;font-size:14.5px;cursor:pointer}
.tabs [aria-current="page"],.tabs [aria-pressed="true"]{background:var(--pine);color:var(--pine-ink);border-color:var(--pine);font-weight:700}
.exs{display:flex;flex-direction:column;gap:8px}
.ex{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 44px;gap:6px;align-items:center}
.sch{display:grid;grid-template-columns:72px minmax(0,1.1fr) minmax(0,.9fr);gap:6px;align-items:center}
.sch .pl{grid-column:2 / -1}
@media (max-width:520px){.sch{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-bottom:10px;border-bottom:1px solid var(--line)}.sch b{grid-column:1 / -1}.sch .pl{grid-column:1 / -1}}
.stp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.stp .ctl{display:flex;align-items:center;border:1px solid var(--edge);border-radius:4px;overflow:hidden;background:var(--surface)}
.stp .ctl button{width:46px;height:46px;border:0;background:none;font-size:20px;cursor:pointer}
.stp .ctl output{min-width:52px;text-align:center;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));z-index:19;background:var(--surface);border-top:1px solid var(--ink)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px}
.bar-in .t{display:flex;flex-direction:column;line-height:1.25}
.bar-in .t span{font-size:13px;color:var(--muted)}
.bar-in .t b{font-family:var(--serif);font-weight:900;font-size:22px}
.cpres{border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.cpres.bad{border-color:var(--warn)}
.pv{background:var(--sunk);border-radius:4px;padding:12px;display:flex;justify-content:center}
.pv canvas{display:block;width:100%;max-width:440px;height:auto;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.log{list-style:none;margin:0;padding:0;font-size:14px}
.log li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);color:var(--ink2)}
.log li:first-child{border-top:0}
.log time{color:var(--muted);white-space:nowrap}

/* 로그인 */
.auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px max(18px,env(safe-area-inset-right,0px)) 40px max(18px,env(safe-area-inset-left,0px));max-width:440px;margin:0 auto;gap:22px}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--ink)}
.auth-logo b{font-family:var(--serif);font-size:20px}
.auth .card{padding:20px 18px;display:flex;flex-direction:column;gap:14px}

/* 창 · 알림 */
.dim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.dim{align-items:center}}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:8px 8px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up 260ms var(--ease)}
@media (min-width:700px){.sheet{border-radius:6px}}
.sheet h2{font-size:19px;font-family:var(--serif)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:4px;font-weight:500;text-align:center;animation:fade 220ms var(--ease)}
body.nonav #toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
body.hasbar #toast{bottom:calc(var(--nav) + 92px + env(safe-area-inset-bottom,0px))}
@keyframes fade{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.view{animation:vin 240ms var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--pine);border-radius:50%;animation:rot .8s linear infinite;margin:40px auto}
@keyframes rot{to{transform:rotate(360deg)}}
.btn,.seg button,.ib,.quick a,.stp .ctl button,.tabs a,.tabs button{transition:transform 140ms var(--ease),background-color 160ms ease}
.btn:active,.seg button:active,.ib:active,.quick a:active,.stp .ctl button:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.sheet,.view,#toast{animation:none}.btn,.seg button,.ib,.quick a,.stp .ctl button{transition:none}.btn:active,.seg button:active,.ib:active,.quick a:active,.stp .ctl button:active{transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">__SYM__</svg>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
'use strict';
/* ══ 설정 ══ */
const CFG={url:'__SB_URL__',key:'__SB_KEY__',ver:'__VER__'};
const READY=!/^__/.test(CFG.url)&&!/^__/.test(CFG.key);
const MAIL='@staff.myfuneral.co.kr';
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';
const sgn=n=>n<0?'−'+won(-n):won(n);
const man=n=>n%10000===0?(n/10000).toLocaleString('ko-KR')+'만원':won(n);
const digits=t=>String(t||'').replace(/\D/g,'');
const telFmt=t=>{ const d=digits(t); if(d.length===11) return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7); if(d.length===10) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6); return String(t||'').trim(); };
const telMask=t=>{ const d=digits(t); return d.length>=10?d.slice(0,3)+'-****-'+d.slice(-4):String(t||'').trim(); };
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const isoOk=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
const fmtDot=s=>{ if(!isoOk(String(s||'').slice(0,10))) return ''; const p=String(s).slice(0,10).split('-').map(Number); return p[0]+'. '+p[1]+'. '+p[2]+'.'; };
const fmtKo=s=>{ const p=String(s).slice(0,10).split('-').map(Number); return p[0]+'년 '+p[1]+'월 '+p[2]+'일'; };
const WD=['일','월','화','수','목','금','토'];
const fmtMD=s=>{ if(!isoOk(s)) return ''; const p=s.split('-').map(Number); return p[1]+'월 '+p[2]+'일 ('+WD[new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay()]+')'; };
const fmtT=t=>{ if(!/^\d{2}:\d{2}/.test(t||'')) return ''; let h=+t.slice(0,2), m=+t.slice(3,5); const ap=h<12?'오전':'오후'; h=h%12||12; return ap+' '+h+'시'+(m?' '+m+'분':''); };
const when=s=>{ if(!s) return ''; const d=new Date(s); if(isNaN(d)) return ''; const n=new Date(); const same=d.toDateString()===n.toDateString();
  return same?String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):(d.getMonth()+1)+'. '+d.getDate()+'.'+(d.getFullYear()!==n.getFullYear()?' ('+String(d.getFullYear()).slice(2)+')':''); };
const whenFull=s=>{ const d=new Date(s); return isNaN(d)?'':(d.getMonth()+1)+'월 '+d.getDate()+'일 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };

const amt=v=>{ v=String(v||'').replace(/[\s,원]/g,''); if(!v) return 0; const neg=/^[-−]/.test(v); v=v.replace(/^[-−]/,''); let n;

const SK='mfa-session';

function keep(t){ sess={a:t.access_token,r:t.refresh_token,e:t.expires_at||Math.floor(Date.now()/1000)+(t.expires_in||3600)}; LS.set(SK,JSON.stringify(sess)); }
function drop(){ sess=null; LS.set(SK,''); }
const authMsg=j=>{ const m=String((j&&(j.msg||j.error_description||j.message||j.error))||'');
  if(/Invalid login/i.test(m)) return '휴대폰 번호나 비밀번호가 맞지 않아요.';
  if(/already registered|already exists/i.test(m)) return '이미 가입한 번호예요. 로그인해 주세요.';
  if(/password/i.test(m)) return '비밀번호를 8자 이상으로 정해 주세요.';
  if(/rate limit|too many/i.test(m)) return '잠시 뒤에 다시 해 주세요.';
  return m||'로그인하지 못했어요.'; };
async function authCall(path,body,token){
  let r; try{ r=await fetch(CFG.url+'/auth/v1/'+path,{method:'POST',headers:Object.assign({apikey:CFG.key,'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{}),body:JSON.stringify(body||{})}); }
  catch(e){ throw new Error('인터넷 연결을 확인해 주세요.'); }
  const t=await r.text(); let j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
  if(!r.ok) throw new Error(authMsg(j)); return j; }
let refreshing=null;
async function refresh(){ if(!sess||!sess.r) throw new Error('다시 로그인해 주세요.');
  if(!refreshing) refreshing=authCall('token?grant_type=refresh_token',{refresh_token:sess.r}).then(t=>{ keep(t); }).catch(e=>{ if(/로그인|맞지/.test(e.message)) drop(); throw e; }).finally(()=>{ refreshing=null; });
  return refreshing; }
async function rpc(fn,args,again){
  if(sess&&sess.e-90<Date.now()/1000){ try{ await refresh(); }catch(e){ if(!sess){ showLogin(); throw new Error('다시 로그인해 주세요.'); } } }
  let r; try{ r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+(sess?sess.a:CFG.key),'Content-Type':'application/json'},body:JSON.stringify(args||{})}); }
  catch(e){ throw new Error('인터넷 연결을 확인해 주세요.'); }
  const t=await r.text(); let j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
  if(r.status===401&&!again&&sess){ try{ await refresh(); return rpc(fn,args,true); }catch(e){ drop(); showLogin(); throw new Error('다시 로그인해 주세요.'); } }
  if(!r.ok){ const m=j&&j.message||''; if(/승인을 기다리|멈춘 계정/.test(m)){ boot(); } throw new Error(m&&/[가-힣]/.test(m)?m:'서버에서 처리하지 못했어요. 잠시 뒤 다시 해 주세요.'); }
  return j; }

    box.innerHTML=Object.keys(groups).map(g=>'<div class="h2">'+esc(g)+'</div><div class="list">'+groups[g].map(s=>'<button type="button" class="li" style="border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;width:100%;cursor:pointer" data-sid="'+esc(s.id)+'"><b>'+esc(s.name)+'</b><span class="s">'+esc([ROLE[s.role],s.phone].join(' · '))+'</span><span class="r">'+(s.status==='stopped'?'<span class="chip warn">정지</span>':'')+'</span></button>').join('')+'</div>').join('')||'<div class="list"><p class="empty">직원이 없어요.</p></div>';
    $$('[data-sid]').forEach(b=>b.onclick=()=>{ const s=st.find(x=>x.id===b.dataset.sid); if(admin) staffSheet(s,false); else if(ME.role==='head'&&['leader','member'].includes(s.role)) resetSheet(s); else toast(s.name+' · '+ROLE[s.role]); }); }
  if(tab==='org'){ box.innerHTML='<div class="stack">'+(org.length?org.map(h=>'<section class="sec"><div class="row" style="justify-content:space-between"><h3 style="font-size:17px">'+esc(h.name)+(h.active?'':' <span class="chip warn">숨김</span>')+'</h3><span class="row"><button class="btn btn-g" data-eh="'+h.id+'">고치기</button><button class="btn btn-l" data-at="'+h.id+'" style="min-height:44px">+ 팀</button></span></div><p class="note">직원 '+h.staff+'명</p>'+
      (h.teams.length?'<div class="list">'+h.teams.map(t=>'<button type="button" class="li" style="border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;width:100%;cursor:pointer" data-et="'+t.id+'" data-h="'+h.id+'"><b>'+esc(t.name)+'</b><span class="s">직원 '+t.staff+'명</span><span class="r">'+(t.active?'':'<span class="chip warn">숨김</span>')+'</span></button>').join('')+'</div>':'<p class="note">아직 팀이 없어요.</p>')+'</section>').join(''):'<p class="empty">본부를 먼저 만들어 주세요.</p>')+
      '<button class="btn btn-p" id="ah">+ 본부 만들기</button></div>';
    const nameSheet=(title,val,active,save)=>sheet('<h2>'+esc(title)+'</h2><input class="in" id="nm" value="'+esc(val||'')+'" placeholder="이름">'+(active!=null?'<label class="chk"><input type="checkbox" id="na"'+(active?'':' checked')+'><span>숨기기 (새로 고를 때 안 보임)</span></label>':'')+'<div class="grid2"><button class="btn btn-l" data-x>그만두기</button><button class="btn btn-p" data-ok>저장</button></div>',(el,close)=>{
      $('[data-x]',el).onclick=close; $('[data-ok]',el).onclick=async()=>{ try{ await save($('#nm',el).value.trim(),!($('#na',el)&&$('#na',el).checked)); close(); toast('저장했어요'); route(); }catch(e){ fail(e); } }; });
    $('#ah').onclick=()=>nameSheet('본부 만들기','',null,(n)=>rpc('mf_save_hq',{p_id:null,p_name:n,p_active:true}));
    $$('[data-eh]').forEach(b=>b.onclick=()=>{ const h=org.find(x=>x.id==b.dataset.eh); nameSheet('본부 고치기',h.name,h.active,(n,a)=>rpc('mf_save_hq',{p_id:h.id,p_name:n,p_active:a})); });
    $$('[data-at]').forEach(b=>b.onclick=()=>{ const h=org.find(x=>x.id==b.dataset.at); nameSheet(h.name+' · 팀 만들기','',null,(n)=>rpc('mf_save_team',{p_id:null,p_hq:h.id,p_name:n,p_active:true})); });
    $$('[data-et]').forEach(b=>b.onclick=()=>{ const h=org.find(x=>x.id==b.dataset.h), t=h.teams.find(x=>x.id==b.dataset.et); nameSheet('팀 고치기',t.name,t.active,(n,a)=>rpc('mf_save_team',{p_id:t.id,p_hq:h.id,p_name:n,p_active:a})); }); }
  if(tab==='set'){ box.innerHTML='<section class="sec"><h2 class="sec-h">직인</h2><p class="note">가입증서에 찍히는 회사 직인이에요. 한 번 넣으면 모든 직원의 증서에 같이 나와요. 흰 바탕에 도장만 있는 사진이 좋아요.</p>'+
      '<div class="row">'+(SETTINGS.stamp?'<img src="'+esc(SETTINGS.stamp)+'" alt="지금 직인" width="72" height="72" style="object-fit:contain;border:1px solid var(--line);border-radius:4px;background:#fff">':'<span class="note">아직 직인이 없어요 · 증서에는 「(인)」으로 나와요</span>')+'</div>'+
      '<div class="row"><label class="btn btn-l" style="position:relative;overflow:hidden">직인 사진 넣기<input type="file" id="stf" accept="image/*" style="position:absolute;inset:0;opacity:0"></label>'+(SETTINGS.stamp?'<button class="btn btn-g" id="std">직인 빼기</button>':'')+'</div></section>';
    $('#stf').onchange=e=>{ const fl=e.target.files&&e.target.files[0]; if(!fl) return; const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=async()=>{ const mx=360, r=Math.min(1,mx/Math.max(im.naturalWidth,im.naturalHeight)); const c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*r); c.height=Math.round(im.naturalHeight*r); const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
        const v=c.toDataURL('image/png'); try{ await rpc('mf_setting_set',{p_key:'stamp',p_value:v}); SETTINGS.stamp=v; loadStamp(); toast('직인을 넣었어요'); route(); }catch(x){ fail(x); } }; im.src=rd.result; }; rd.readAsDataURL(fl); };
    if($('#std')) $('#std').onclick=async()=>{ if(!(await ask('직인을 뺄까요?','가입증서에 「(인)」으로 나와요.','빼기',true))) return; try{ await rpc('mf_setting_set',{p_key:'stamp',p_value:''}); SETTINGS.stamp=''; loadStamp(); route(); }catch(x){ fail(x); } }; }
});
function staffSheet(s,approve){
  const org=ORG||[]; let role=s.role==='admin'&&approve?'member':s.role, hq=s.hq_id||'', team=s.team_id||'', status=approve?'active':s.status;
  const hqOpts=()=>'<option value="">본부 고르기</option>'+org.filter(h=>h.active||h.id==hq).map(h=>'<option value="'+h.id+'">'+esc(h.name)+'</option>').join('');
  const teamOpts=()=>{ const h=org.find(x=>x.id==hq); return '<option value="">팀 고르기</option>'+(h?h.teams.filter(t=>t.active||t.id==team).map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join(''):''); };
  sheet('<h2>'+esc(s.name)+(approve?' · 가입 승인':'')+'</h2><p class="note">'+esc([s.phone,s.wish&&'적은 소속: '+s.wish].filter(Boolean).join(' · '))+'</p>'+
    '<div class="fld"><span class="lbl">역할</span><div class="seg" role="group" aria-label="역할">'+['head','leader','member','admin'].map(r=>'<button type="button" data-r="'+r+'">'+ROLE[r]+'</button>').join('')+'</div></div>'+
    '<div class="fld" data-hqw><label class="lbl" for="s-hq">본부</label><select class="in" id="s-hq"></select></div><div class="fld" data-tw><label class="lbl" for="s-tm">팀</label><select class="in" id="s-tm"></select></div>'+
    (org.length?'':'<p class="warn">본부 · 팀을 먼저 만들어 주세요 (관리 → 본부 · 팀).</p>')+
    (approve?'':'<div class="fld"><span class="lbl">상태</span><div class="seg" role="group" aria-label="상태"><button type="button" data-ss="active">사용 중</button><button type="button" data-ss="stopped">정지</button></div></div>')+
    '<p class="warn" id="s-err" hidden></p><div class="grid2"><button class="btn btn-l" data-x>그만두기</button><button class="btn btn-p" data-ok>'+(approve?'승인':'저장')+'</button></div>'+
    (approve?'<button class="btn btn-g" data-rej style="color:var(--warn)">가입 거절 (정지)</button>':'<button class="btn btn-g" data-pw>비밀번호 초기화</button>'),(el,close)=>{
    const sh=$('#s-hq',el), stm=$('#s-tm',el);
    const paint=()=>{ $$('[data-r]',el).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.r===role))); $$('[data-ss]',el).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ss===status)));
      $('[data-hqw]',el).hidden=role==='admin'; $('[data-tw]',el).hidden=role==='admin'||role==='head'; sh.innerHTML=hqOpts(); sh.value=hq||''; stm.innerHTML=teamOpts(); stm.value=team||''; };
    $$('[data-r]',el).forEach(b=>b.onclick=()=>{ role=b.dataset.r; paint(); }); $$('[data-ss]',el).forEach(b=>b.onclick=()=>{ status=b.dataset.ss; paint(); });
    sh.onchange=()=>{ hq=sh.value; team=''; paint(); }; stm.onchange=()=>{ team=stm.value; };
    paint(); $('[data-x]',el).onclick=close;
    $('[data-ok]',el).onclick=async()=>{ const er=$('#s-err',el); try{ await rpc('mf_staff_set',{p_id:s.id,p_role:role,p_status:status,p_hq:role==='admin'?(hq?+hq:null):(hq?+hq:null),p_team:(role==='leader'||role==='member')&&team?+team:null});
      close(); toast(approve?s.name+' 님을 승인했어요':'저장했어요'); STAFF=null; route(); }catch(x){ er.hidden=false; er.textContent=x.message; } };
    if($('[data-rej]',el)) $('[data-rej]',el).onclick=async()=>{ try{ await rpc('mf_staff_set',{p_id:s.id,p_role:'member',p_status:'stopped',p_hq:null,p_team:null}); }catch(x){ /* 팀 없이 정지 */ }
      close(); route(); };
    if($('[data-pw]',el)) $('[data-pw]',el).onclick=()=>{ close(); resetSheet(s); }; });
}
function resetSheet(s){ ask(s.name+' 님 비밀번호를 초기화할까요?','임시 비밀번호가 나와요. 본인에게 알려 주시면, 로그인할 때 새 비밀번호를 정하게 돼요.','초기화').then(async ok=>{ if(!ok) return;
  try{ const pw=await rpc('mf_staff_reset_pw',{p_id:s.id}); sheet('<h2>임시 비밀번호</h2><p class="big-total" style="text-align:center;letter-spacing:.08em">'+esc(pw)+'</p><p class="muted">'+esc(s.name)+' 님께 알려 주세요. 로그인하면 새 비밀번호를 정하게 돼요.</p><button class="btn btn-l" data-c>복사</button><button class="btn btn-p" data-x>닫기</button>',(el,close)=>{ $('[data-c]',el).onclick=()=>copyText(pw,'복사했어요'); $('[data-x]',el).onclick=close; }); }catch(x){ fail(x); } }); }

/* ══ 내 정보 ══ */
let installEvt=null; window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; });
on(/^\/me$/,()=>{
  frame({title:'내 정보',back:'/'});
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  V('<div class="stack"><section class="sec"><dl class="kv"><div><dt>이름</dt><dd>'+esc(ME.name)+'</dd></div><div><dt>아이디</dt><dd>'+esc(ME.phone)+' <small>휴대폰 번호로 로그인해요</small></dd></div><div><dt>역할</dt><dd>'+esc(ROLE[ME.role])+'</dd></div><div><dt>소속</dt><dd>'+esc([ME.hq_name,ME.team_name].filter(Boolean).join(' · ')||'본사')+'</dd></div></dl>'+
    '<div class="grid2"><button class="btn btn-l" id="m-nm">이름 고치기</button><button class="btn btn-l" id="m-pw">비밀번호 바꾸기</button></div></section>'+
    (standalone?'':'<section class="sec"><h2 class="sec-h">휴대폰 홈 화면에 앱 두기</h2>'+(installEvt?'<button class="btn btn-p" id="m-in">홈 화면에 추가</button>':'<p class="muted">'+(IS_IOS?'사파리 아래 가운데 「공유」 버튼 → 「홈 화면에 추가」를 눌러 주세요.':'크롬 오른쪽 위 「⋮」 → 「홈 화면에 추가」(또는 「앱 설치」)를 눌러 주세요.')+'</p>')+'</section>')+
    '<button class="btn btn-w" id="m-out">로그아웃</button><p class="note" style="text-align:center">나만의장례 업무 앱 · '+esc(CFG.ver)+'</p></div>');
  $('#m-nm').onclick=()=>sheet('<h2>이름 고치기</h2><input class="in" id="nn" value="'+esc(ME.name)+'"><div class="grid2"><button class="btn btn-l" data-x>그만두기</button><button class="btn btn-p" data-ok>저장</button></div>',(el,close)=>{ $('[data-x]',el).onclick=close;
    $('[data-ok]',el).onclick=async()=>{ try{ await rpc('mf_set_my_name',{p_name:$('#nn',el).value}); ME.name=$('#nn',el).value.trim(); close(); toast('고쳤어요'); route(); }catch(x){ fail(x); } }; });
  $('#m-pw').onclick=()=>sheet('<h2>비밀번호 바꾸기</h2><input class="in" id="p1" type="password" autocomplete="new-password" placeholder="새 비밀번호 (8자 이상)"><input class="in" id="p2" type="password" autocomplete="new-password" placeholder="한 번 더"><p class="warn" id="pe" hidden></p><div class="grid2"><button class="btn btn-l" data-x>그만두기</button><button class="btn btn-p" data-ok>바꾸기</button></div>',(el,close)=>{ $('[data-x]',el).onclick=close;
    $('[data-ok]',el).onclick=async()=>{ const a=$('#p1',el).value, b=$('#p2',el).value, er=$('#pe',el); if(a.length<8){ er.hidden=false; er.textContent='8자 이상으로 정해 주세요.'; return; } if(a!==b){ er.hidden=false; er.textContent='두 번 넣은 비밀번호가 달라요.'; return; }
      try{ await rpc('mf_change_pw',{p_new:a}); close(); toast('비밀번호를 바꿨어요'); }catch(x){ er.hidden=false; er.textContent=x.message; } }; });
  if($('#m-in')) $('#m-in').onclick=()=>{ installEvt.prompt(); installEvt=null; };
  $('#m-out').onclick=async()=>{ if(await ask('로그아웃할까요?','','로그아웃',true)) logout(); };
});

/* ══ 앱 업데이트 · 시작 ══ */
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
})();
</script>
